<!DOCTYPE html>
<html>
<head>
  <title>Flowchart Viewer</title>
  <style>
    body {
      font-family: Arial;
      text-align: center;
      margin: 40px;
      background: #f5f5f5;
    }

    .container {
      display: inline-block;
      background: white;
      padding: 20px;
      border-radius: 10px;
      box-shadow: 0 2px 12px rgba(0,0,0,0.1);
    }

    img {
      max-width: 100%;
      height: auto;
      border: 1px solid #ddd;
    }

    .title {
      margin-bottom: 15px;
      font-size: 20px;
      font-weight: bold;
    }
  </style>
</head>

<body>

<div class="container">
  <div class="title">Generated Flowchart</div>
  <img src="flowchart.png" alt="Flowchart">
</div>

</body>
</html>
